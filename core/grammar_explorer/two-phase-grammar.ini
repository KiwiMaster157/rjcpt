[characters]
alpha=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_
digit=0123456789
string_char_sym=" !#$%&()*+,-./:;<=>?@[]^`{|}~"

[tokens]
id=
int=
num=
sstr=
dstr=
lparen=
rparen=
lbracket=
rbracket=
lbrace=
rbrace=
plus=
hyphen=
asterisk=
slash=
caret=
pipe=
comma=
exclam=
cmp_eq=
cmp_ne=
cmp_lt=
cmp_le=
cmp_gt=
cmp_ge=
kw_and=
kw_or=
kw_not=

[lexicon]
TOKEN= WS TOKEN2
TOKEN2= ID | NUMBER | SYMBOL | SQ_STRING | DQ_STRING
WS= WS_CHAR WS |
WS_CHAR= $9 | $10 | $13 | $32
DQUOT= $34
SQUOT= $39
BSLASH= $92

ID= { WORD }id
WORD= alpha WORD2
WORD2= alpha WORD2 | digit WORD2 |

INTEGER= digit INTEGER2
INTEGER2= digit INTEGER2 |

NUMBER= { INTEGER NUMBER2
NUMBER2= '.' NUMBER3 }num | }int
NUMBER3= INTEGER NUM_EXP | NUM_EXP
NUM_EXP= EXP_BEGIN EXP_SIGN INTEGER |
EXP_BEGIN= 'e' | 'E'
EXP_SIGN= '+' | '-' |

SQ_STRING= { SQUOT SQ_STRING_CONT SQUOT }sstr
SQ_STRING_CONT= SQ_STRING_CHAR SQ_STRING_CONT |
SQ_STRING_CHAR= STRING_CHAR | DQUOT

DQ_STRING= { DQUOT DQ_STRING_CONT DQUOT }dstr
DQ_STRING_CONT= DQ_STRING_CHAR DQ_STRING_CONT |
DQ_STRING_CHAR= STRING_CHAR | SQUOT

STRING_CHAR= alpha | digit | string_char_sym | STRING_ESC
STRING_ESC= BSLASH escape_char

SYMBOL= GROUPING_SYM | ARITHMETIC_SYM | COMPARISON_SYM | DOT_SYM
GROUPING_SYM= { '(' }lparen | { ')' }rparen | { '[' }lbracket | { ']' }rbracket | { '{' }lbrace | { '}' }rbrace
ARITHMETIC_SYM= { '+' }plus | { '-' }hyphen | { '*' }asterisk | { '/' }slash | { '^' }caret | { '|' }pipe | { ',' }comma
COMPARISON_SYM= { '<' CMP_LESS2 | { '>' CMP_GREATER2 | { '=' CMP_EQUAL2 | { '!' CMP_NOT2
CMP_LESS2= '=' }cmp_le | }cmp_lt
CMP_GREATER2= '=' }cmp_ge | }cmp_gt
CMP_EQUAL2= '=' }cmp_eq | }cmp_eq
CMP_NOT2= '=' }cmp_ne | }exclam

[constructs]
empty=1
integer=2
number=3
ident=4
qual-ident=5

begin-args=16
end-args=17
add-arg=18

push-add=32
push-sub=33
push-mul=34
push-div=35
push-exp=36
push-pipe=37
push-imul=38
push-noop=39

push-bool-and=40
push-bool-or=41
push-bool-not=42

push-cmp-less=43
push-cmp-less-eq=44
push-cmp-greater=45
push-cmp-greater-eq=46
push-cmp-equal=47
push-cmp-inequal=48

pop-add=64
pop-sub=65
pop-mul=66
pop-div=67
pop-exp=68
pop-pipe=69
pop-imul=70
pop-noop=71

pop-bool-and=72
pop-bool-or=73
pop-bool-not=74

pop-cmp-less=75
pop-cmp-less-eq=76
pop-cmp-greater=77
pop-cmp-greater-eq=78
pop-cmp-equal=79
pop-cmp-inequal=80

[grammar]
ENTRY= EXPR | .empty
EXPR= SUM | PIPE

SUM= PRODUCT SUM2
SUM2= .push-add plus PRODUCT .pop-add SUM2 | .push-sub hyphen PRODUCT .pop-sub SUM2 |

PRODUCT= CORE_EXPR PRODUCT2
PRODUCT2= .push-mul asterisk CORE_EXPR .pop-mul PRODUCT2
        | .push-div slash CORE_EXPR .pop-div PRODUCT2 |

PAREN_EXPR= .push-noop lparen EXPR .pop-noop rparen
ATOM= id | number | int
ATOM_OR_PAREN= ATOM | PAREN_EXPR
CORE_EXPR= ATOM CORE_EXPR2 | PAREN_EXPR CORE_EXPR3 |
CORE_EXPR2= lparen ARG_LIST rparen | .push-exp caret ATOM_OR_PAREN .pop-exp | .push-imul ATOM .pop-imul
CORE_EXPR3= .push-imul ATOM_OR_PAREN .pop-imul | .push-exp caret ATOM_OR_PAREN .pop-exp

ARG_LIST= .begin-args ARG_LIST2 .end-args
ARG_LIST2= ARG ARG_LIST3
ARG_LIST3= comma ARG_LIST2
ARG= EXPR .push-arg

